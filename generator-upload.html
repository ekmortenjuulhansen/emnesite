<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Katibeh&display=swap" rel="stylesheet">

    <link rel="icon" href="./favicon.ico" />

    <title>Generator - Upload</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="layout.css">
</head>

<body>

    <header class="site_header">
        <a href="index.html" class="header_logo">
            <img src="./svg_ikoner/emnesite_logo.svg" alt="Unique Piano Generator Logo">
        </a>

    </header>

    <main>


        <div class="trinindikator">
            <div class="trin upload_trin active_trin">
                <h3>1</h3>
                <h2>UPLOAD</h2>
            </div>
            <img class="pil_generator_sites" src="./svg_ikoner/Pil.svg" alt="Pil">
            <div class="trin customize_trin">
                <h3>2</h3>
                <h2>CUSTOMIZE</h2>
            </div>
            <img class="pil_generator_sites" src="./svg_ikoner/Pil.svg" alt="Pil">
            <div class="trin generate_trin">
                <h3>3</h3>
                <h2>GENERATE</h2>
            </div>
            <img class="pil_generator_sites" src="./svg_ikoner/Pil.svg" alt="Pil">
            <div class="trin done_trin">
                <h3>4</h3>
                <h2>DONE</h2>
            </div>
        </div>

        <div class="generator_form">
            <h3> YOUR UNIQUE SAMPLES</h3>

            <form class="generator_upload" onsubmit="return false">
                <label for="upload_samle">Upload your samples:</label>
                <input type="file" id="upload_sample" name="UploadSample" accept="audio/*">
            </form>
        </div>

        <div class="back_save">
            <a class="back_knap" href="generator-basics.html">← BACK</a>
            <a class="save_knap" href="generator-upload.html">SAVE →</a>
        </div>

    </main>

    <script src="menu.js"></script>

</body>

</html>
